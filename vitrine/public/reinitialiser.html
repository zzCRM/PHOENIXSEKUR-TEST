<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe — Phoenix Sekur</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <script src="/config.js"></script>
</head>
<body class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-wrap">
    <a href="/" class="auth-logo"><span class="logo-flame">🔥</span> Phoenix <strong>Sekur</strong></a>
    <div class="auth-card" id="reset-card">
      <h1>Nouveau mot de passe</h1>
      <p class="auth-sub" id="reset-sub">Choisissez un mot de passe sécurisé (8 caractères minimum).</p>
      <form id="reset-form" class="auth-form hidden">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email-display" readonly class="readonly" />
        </div>
        <div class="field">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm">Confirmer</label>
          <input type="password" id="confirm" required minlength="8" autocomplete="new-password" />
        </div>
        <div id="msg-error" class="form-msg error hidden"></div>
        <div id="msg-success" class="form-msg success hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">Enregistrer</button>
      </form>
      <div id="invalid-token" class="form-msg error hidden">
        Lien invalide ou expiré. <a href="/mot-de-passe-oublie.html">Demander un nouveau lien</a>
      </div>
    </div>
    <p class="auth-back"><a href="/login.html">← Connexion</a></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/reset.js"></script>
</body>
</html>
