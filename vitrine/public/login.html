<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Phoenix Sekur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <script src="/config.js"></script>
</head>
<body class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-wrap">
    <a href="/" class="auth-logo">
      <span class="logo-flame">🔥</span> Phoenix <strong>Sekur</strong>
    </a>

    <div class="auth-card">
      <h1>Connexion</h1>
      <p class="auth-sub">Choisissez votre espace puis connectez-vous</p>

      <div class="portal-tabs" role="tablist">
        <button type="button" class="portal-tab active" data-portal="entreprise">
          <span class="portal-icon">🏢</span>
          <span class="portal-label">Entreprise</span>
          <span class="portal-desc">Administrateurs</span>
        </button>
        <button type="button" class="portal-tab" data-portal="collaborateur">
          <span class="portal-icon">👮</span>
          <span class="portal-label">Collaborateur</span>
          <span class="portal-desc">Agents & équipes</span>
        </button>
        <button type="button" class="portal-tab" data-portal="client">
          <span class="portal-icon">🏛️</span>
          <span class="portal-label">Client</span>
          <span class="portal-desc">Espace client</span>
        </button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="hidden" id="portal" name="portal" value="entreprise" />
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="vous@societe.fr" />
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div id="login-error" class="form-msg error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">Se connecter</button>
        <p class="auth-forgot">
          <a href="/mot-de-passe-oublie.html">Mot de passe oublié ?</a>
        </p>
      </form>
    </div>

    <p class="auth-back"><a href="/">← Retour à l'accueil</a></p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
