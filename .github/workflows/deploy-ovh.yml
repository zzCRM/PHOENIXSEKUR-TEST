# Déploiement automatique OVH — comme Base44 / Cursor
# À chaque push sur main, le VPS se met à jour tout seul.
# Vous n'avez plus besoin de KVM ni de taper des commandes.

name: Deploy Phoenix Sekur (OVH)

on:
  push:
    branches: [main, cursor/migrate-off-base44-6bc2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/phoenixsekur
            git fetch origin
            git checkout cursor/migrate-off-base44-6bc2 || git checkout main
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
            echo "✅ Déployé $(date)"
