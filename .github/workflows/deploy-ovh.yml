# Déploiement automatique OVH — comme Phoenix CRM sur Hetzner

name: Deploy Phoenix Sekur (OVH)

on:
  push:
    branches: [main, cursor/migrate-off-base44-6bc2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          KEY_B64: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "❌ Secret VPS_SSH_KEY manquant"
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > deploy_key
          chmod 600 deploy_key
          ssh-keygen -y -f deploy_key > /dev/null
          echo "✅ Clé SSH valide"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: deploy_key
          command_timeout: 20m
          script: |
            set -e
            cd /opt/phoenixsekur
            git fetch origin
            git checkout cursor/migrate-off-base44-6bc2 || git checkout main
            git pull
            docker compose -f docker-compose.prod.yml up -d --build
            echo "✅ Déployé $(date)"
