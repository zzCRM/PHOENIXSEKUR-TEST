services:
  postgres:
    image: postgres:16-alpine
    container_name: phoenixsekur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix_dev
      POSTGRES_DB: phoenixsekur
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: phoenixsekur-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://phoenix:phoenix_dev@postgres:5432/phoenixsekur
      JWT_SECRET: change-me-in-production
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3001:3001"

volumes:
  postgres_data:
